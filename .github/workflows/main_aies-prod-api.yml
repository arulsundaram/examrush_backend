# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - aies-prod-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: yarn install

      - name: Build application
        run: yarn build

      - name: Install production dependencies
        run: |
          # Remove development dependencies
          rm -rf node_modules
          # Install only production dependencies
          yarn install --production

      - name: Zip artifact
        run: zip -r release.zip dist/ node_modules/ package.json yarn.lock .env

      - name: Unzip artifact for deployment
        run: unzip release.zip -d deploy-folder

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "aies-prod-api"
          slot-name: "Production"
          package: deploy-folder
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3BC3E66B9447457ABA751008F59E5059 }}
